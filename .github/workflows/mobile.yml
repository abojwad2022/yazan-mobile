name: Mobile apps

# Builds and tests YAZAN Store and YAZAN Admin on all four targets, independently:
#   Store/Android, Store/iOS (simulator, unsigned), Admin/Android, Admin/iOS (simulator, unsigned).
#
# Nothing here signs a release or publishes anything. Release signing needs secrets the owner adds
# later (Android keystore; Apple Developer account); until then the artifacts are debug/unsigned and
# are labelled that way. No keystore, certificate, google-services.json or token is committed.

on:
  push:
    branches: [ 'feature/mobile-apps', 'main' ]
    paths: [ 'mobile/**', '.github/workflows/mobile.yml' ]
  pull_request:
    paths: [ 'mobile/**', '.github/workflows/mobile.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Shared packages (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Report toolchain
        run: flutter --version
      - name: Bootstrap workspace
        working-directory: mobile
        run: |
          dart pub global activate melos
          bash tools/ci_run.sh bootstrap melos bootstrap
      - name: Analyze
        working-directory: mobile
        run: bash tools/ci_run.sh analyze melos run analyze
      - name: Test
        working-directory: mobile
        run: |
          bash tools/ci_run.sh test melos run test
          bash tools/ci_run.sh test-flutter melos run test:flutter

  android:
    name: ${{ matrix.app }} / Android
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: yazan_store, short: store }
          - { app: yazan_admin, short: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap workspace
        working-directory: mobile
        run: |
          dart pub global activate melos
          bash tools/ci_run.sh bootstrap melos bootstrap
      - name: Generate platform folders and localisations
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          bash ../../tools/ci_run.sh scaffold bash ../../tools/scaffold_platforms.sh ${{ matrix.short }} ${{ matrix.app }}
          bash ../../tools/ci_run.sh gen-l10n flutter gen-l10n
      - name: Analyze and test the app
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          bash ../../tools/ci_run.sh app-analyze flutter analyze
          bash ../../tools/ci_run.sh app-test flutter test
      - name: Build debug APK
        working-directory: mobile/apps/${{ matrix.app }}
        run: bash ../../tools/ci_run.sh apk flutter build apk --debug --dart-define=YAZAN_ENV=ci
      - name: Check the APK carries no server secrets
        run: |
          set -e
          apk="mobile/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk"
          mkdir -p /tmp/apk && unzip -q -o "$apk" -d /tmp/apk
          if grep -rIlE 'consumer_(key|secret)|ck_[0-9a-f]{20,}|cs_[0-9a-f]{20,}|sk_(live|test)_[A-Za-z0-9]{10,}|yz_live_[A-Za-z0-9]{10,}' /tmp/apk; then
            echo "Secret-looking string found in the APK" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android-debug-apk
          path: mobile/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios:
    name: ${{ matrix.app }} / iOS (simulator, unsigned)
    needs: packages
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: yazan_store, short: store }
          - { app: yazan_admin, short: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap workspace
        working-directory: mobile
        run: |
          dart pub global activate melos
          bash tools/ci_run.sh bootstrap melos bootstrap
      - name: Generate platform folders and localisations
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          bash ../../tools/ci_run.sh scaffold bash ../../tools/scaffold_platforms.sh ${{ matrix.short }} ${{ matrix.app }}
          bash ../../tools/ci_run.sh gen-l10n flutter gen-l10n
      - name: Build for the simulator (no code signing)
        working-directory: mobile/apps/${{ matrix.app }}
        run: bash ../../tools/ci_run.sh ios flutter build ios --simulator --debug --no-codesign --dart-define=YAZAN_ENV=ci
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-simulator-app
          path: mobile/apps/${{ matrix.app }}/build/ios/iphonesimulator/Runner.app
          retention-days: 14
