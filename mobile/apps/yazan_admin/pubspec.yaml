name: yazan_admin
description: YAZAN Admin - staff app.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  yazan_domain:
  yazan_api_client:
  yazan_design_system:
  yazan_offline_sync:
  yazan_storage:
dev_dependencies:
  flutter_test:
    sdk: flutter
  dio: ^5.7.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0E0E10"
  adaptive_icon_background: "#0E0E10"
  adaptive_icon_foreground: "assets/icon/icon.png"
