name: yazan_store
description: YAZAN Store - customer app.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_secure_storage: ^9.2.2
  # QR / barcode camera for the ring check (lib/src/verify/mobile_serial_scanner.dart is written
  # against the 5.x API; check that file before moving to 6.x or later).
  mobile_scanner: ^5.2.3
  # "Sign in or create account" on the website (lib/src/web_sign_in/web_sign_in.dart; the flow itself
  # is WebSignIn in yazan_api_client): Custom Tabs on Android, ASWebAuthenticationSession on iOS.
  # 5.x is the stable line (Dart >=3.5, Flutter >=3.24); 6.x (still alpha) is the one for AGP 9 /
  # built-in Kotlin. Its Android CallbackActivity is added by mobile/tools/scaffold_platforms.sh.
  flutter_web_auth_2: ^5.1.0
  # Native "Continue with Google" (lib/src/auth/social_sign_in.dart): Android Credential Manager.
  # Written against the 7.x API (GoogleSignIn.instance.initialize / authenticate); only used when the
  # build has --dart-define=YAZAN_GOOGLE_SERVER_CLIENT_ID=... . 7.1.x needs Dart 3.6, 7.2 Dart 3.7.
  google_sign_in: ^7.1.1
  # Opens the Terms, Privacy Policy and account-deletion pages in the phone's browser.
  url_launcher: ^6.3.1
  yazan_domain:
  yazan_api_client:
  yazan_design_system:
  yazan_offline_sync:
  yazan_storage:
dev_dependencies:
  flutter_test:
    sdk: flutter
  dio: ^5.7.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#5A1426"
  adaptive_icon_background: "#5A1426"
  adaptive_icon_foreground: "assets/icon/icon.png"
